<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Painel pessoal | Gerador de Relatório</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container">
      <header class="page-header">
        <div>
          <p class="eyebrow">Painel pessoal</p>
          <h1 id="account-title">Meu relatório</h1>
        </div>
        <button type="button" id="logout-button" class="secondary-button">Sair</button>
      </header>

      <div class="layout">
        <section class="card">
          <h2>Adicionar atividade</h2>
          <form id="activity-form">
            <div class="field">
              <label for="start-time">Horário de início</label>
              <input type="time" id="start-time" name="start-time" required />
            </div>
            <div class="field">
              <label for="end-time">Horário de término</label>
              <input type="time" id="end-time" name="end-time" required />
            </div>
            <div class="field">
              <label for="title">Título da atividade</label>
              <input type="text" id="title" name="title" placeholder="Ex.: Revisão de código" required />
            </div>
            <div class="field">
              <label for="description">Descrição da atividade</label>
              <textarea id="description" name="description" placeholder="Descreva o que foi realizado"></textarea>
            </div>
            <button type="submit">Adicionar atividade</button>
          </form>
        </section>

        <section class="report">
          <div class="report-header">
            <h2>Relatório de atividades</h2>
            <div>
              <button type="button" id="copy-report">Copiar</button>
              <button type="button" id="delete-report" class="danger-button">Apagar relatório</button>
            </div>
          </div>
          <div id="report-list"></div>
        </section>
      </div>
    </main>

    <div id="confirm-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
      <div class="modal-content">
        <h2 id="confirm-title">Apagar relatório?</h2>
        <p>Todo o conteúdo do seu relatório será removido permanentemente deste navegador.</p>
        <div class="modal-actions">
          <button type="button" id="cancel-delete" class="secondary-button">Cancelar</button>
          <button type="button" id="confirm-delete" class="danger-button">Apagar</button>
        </div>
      </div>
    </div>
    <script src="auth.js" defer></script>
    <script src="painel.js" defer></script>
  </body>
</html>
