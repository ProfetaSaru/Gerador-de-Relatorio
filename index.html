<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gerador de Relatório</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container">
      <h1>GERADOR DE RELATÓRIO</h1>

      <div class="layout">
        <section class="card">
          <h2>ADICIONAR ATIVIDADE</h2>

          <form id="activity-form">
            <div class="field">
              <label for="start-time">Horário de Início:</label>
              <input type="time" id="start-time" name="start-time" required />
            </div>

            <div class="field">
              <label for="end-time">Horário de Término:</label>
              <input type="time" id="end-time" name="end-time" required />
            </div>

            <div class="field">
              <label for="title">Título da Atividade:</label>
              <input type="text" id="title" name="title" placeholder="Ex.: Revisão de código" required />
            </div>

            <div class="field">
              <label for="description">Descrição da Atividade:</label>
              <textarea
                id="description"
                name="description"
                placeholder="Descreva o que foi realizado"
              ></textarea>
            </div>

            <button type="submit">Adicionar Atividade</button>
          </form>
        </section>

        <section class="report">
          <div class="report-header">
            <h2>Relatório de Conclusão de Atividades</h2>
            <button type="button" id="copy-report">Copiar</button>
          </div>

          <div id="report-list"></div>
        </section>
      </div>
    </main>

    <script src="script.js" defer></script>
  </body>
</html>
