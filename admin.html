<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Painel administrativo | Gerador de Relatório</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container">
      <header class="page-header">
        <div>
          <p class="eyebrow">Área restrita</p>
          <h1>Painel administrativo</h1>
        </div>
        <button type="button" id="logout-button" class="secondary-button">Sair</button>
      </header>

      <section class="admin-panel admin-page-panel">
        <h2>Cadastrar conta pessoal</h2>
        <p class="helper-text">Cada conta terá seu próprio painel e relatório de atividades.</p>
        <form id="account-form" class="account-form">
          <div class="field">
            <label for="account-name">Nome da conta</label>
            <input type="text" id="account-name" required placeholder="Ex.: Maria Silva" />
          </div>
          <div class="field">
            <label for="account-username">Usuário</label>
            <input type="text" id="account-username" required autocomplete="off" />
          </div>
          <div class="field">
            <label for="account-password">Senha</label>
            <input type="password" id="account-password" required autocomplete="new-password" />
          </div>
          <button type="submit">Cadastrar conta</button>
        </form>
        <p id="account-message" class="form-message" role="alert"></p>
      </section>

      <section class="card account-list-panel">
        <h2>Contas cadastradas</h2>
        <div id="account-list"></div>
      </section>
    </main>
    <script src="auth.js?v=2" defer></script>
    <script src="admin.js?v=3" defer></script>
  </body>
</html>
